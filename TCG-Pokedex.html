<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TCG Pokédex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0A0A0A; color: #F0EDE4; font-family: system-ui, -apple-system, sans-serif; }

    .header { background: #111111; border-bottom: 1px solid #2A2A2A; padding: 12px 16px; position: sticky; top: 0; z-index: 50; }
    .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, #CC0000, #FFCB05); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    .header p { font-size: 11px; color: #555; }

    .tabs { background: #1C1C1C; border-bottom: 1px solid #2A2A2A; display: flex; gap: 4px; padding: 8px; overflow-x: auto; }
    .tab-btn { flex: 0 0 auto; padding: 8px 14px; background: transparent; border: none; color: #888; font-size: 11px; font-weight: 400; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: #2A2A2A; color: #FFCB05; font-weight: 600; }

    .content { max-width: 780px; margin: 0 auto; padding: 14px 14px 100px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .lang-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
    .lang-btn { flex: 1; padding: 9px; background: transparent; border: 1px solid #2A2A2A; color: #888; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .lang-btn.active { background: #1C1C1C; border-color: #FFCB05; color: #FFCB05; }

    select { background: #1C1C1C; border: 1px solid #2A2A2A; color: #F0EDE4; border-radius: 8px; padding: 8px 10px; width: 100%; font-size: 14px; margin-bottom: 10px; outline: none; -webkit-appearance: none; }

    .verdict-box { background: rgba(61, 187, 80, 0.10); border: 1.5px solid #3DBB50; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .verdict-title { font-size: 18px; font-weight: 700; color: #3DBB50; margin-bottom: 6px; }
    .verdict-note { font-size: 13px; color: #888; }

    .category-label { font-size: 10px; color: #555; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
    .products-table { background: #111111; border: 1px solid #2A2A2A; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
    table { width: 100%; font-size: 12px; border-collapse: collapse; }
    th { padding: 8px; text-align: left; color: #555; font-weight: 400; font-size: 10px; background: #1C1C1C; border-bottom: 1px solid #2A2A2A; }
    td { padding: 8px; border-bottom: 1px solid #2A2A2A; }
    tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: #1C1C1C; }
    tbody tr:nth-child(odd) { background: #0A0A0A; }
    .price { text-align: center; color: #FFCB05; font-weight: 600; }
    .verdict { text-align: center; }
    .badge { display: inline-block; background: rgba(61, 187, 80, 0.20); color: #3DBB50; border: 1px solid rgba(61, 187, 80, 0.44); border-radius: 4px; padding: 3px 8px; font-size: 10px; font-weight: 700; }

    .tracker-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-box { background: #111111; border: 1px solid #2A2A2A; border-radius: 8px; padding: 12px; }
    .stat-label { font-size: 10px; color: #555; }
    .stat-value { font-size: 16px; font-weight: 700; margin-top: 4px; }

    .tracker-item { background: #111111; border: 1px solid #2A2A2A; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .tracker-item-info { flex: 1; }
    .tracker-item-name { font-weight: 600; }
    .tracker-item-paid { font-size: 11px; color: #555; }
    .tracker-item-pl { text-align: right; }
    .tracker-item-pl-val { font-size: 14px; font-weight: 700; }
    .tracker-item-worth { font-size: 10px; color: #555; }
    .delete-btn { background: transparent; border: 1px solid #2A2A2A; color: #555; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; }

    .form-group { margin-bottom: 8px; }
    input { background: #1C1C1C; border: 1px solid #2A2A2A; color: #F0EDE4; border-radius: 6px; padding: 8px; width: 100%; font-size: 12px; outline: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    button { background: #3DBB50; color: #0A0A0A; border: none; border-radius: 8px; padding: 10px; cursor: pointer; font-weight: 700; font-size: 14px; width: 100%; }
    button:hover { opacity: 0.9; }

    .empty-state { background: #111111; border: 1px solid #2A2A2A; border-radius: 10px; padding: 20px; text-align: center; color: #555; }
  </style>
</head>
<body>
  <div class="header">
    <h1>TCG Pokédex</h1>
    <p>Live market data • Portfolio tracking</p>
  </div>

  <div class="tabs" id="tabButtons"></div>

  <div class="content">
    <div class="tab-content active" id="tab-scout">
      <div class="lang-buttons" id="langButtons"></div>
      <select id="setSelect"></select>
      <div class="verdict-box">
        <div class="verdict-title" id="verdictTitle">Set Info</div>
        <div class="verdict-note" id="verdictNote">Select a set to see details</div>
      </div>
      <div id="productsContainer"></div>
    </div>

    <div class="tab-content" id="tab-market">
      <h3 style="color: #FFCB05; margin-bottom: 16px;">Market Data</h3>
      <div id="marketContent"></div>
    </div>

    <div class="tab-content" id="tab-tracker">
      <div class="tracker-stats">
        <div class="stat-box">
          <div class="stat-label">Spent</div>
          <div class="stat-value" id="trackerSpent">$0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Value Now</div>
          <div class="stat-value" id="trackerValue" style="color: #3DBB50;">$0.00</div>
        </div>
      </div>
      <div id="trackerList"></div>
      <div style="background: #111111; border: 1px solid #2A2A2A; border-radius: 10px; padding: 12px; margin-top: 16px;">
        <div class="form-group"><input type="text" id="trackerName" placeholder="What (e.g. Evolving Skies ETB)"></div>
        <div class="form-row">
          <input type="number" id="trackerCost" placeholder="Paid $" step="0.01" min="0">
          <input type="number" id="trackerValue2" placeholder="Worth $" step="0.01" min="0">
        </div>
        <button onclick="addTracker()">+ Add Purchase</button>
      </div>
    </div>
  </div>

  <script>
    const C = {
      bg: "#0A0A0A", panel: "#111111", p2: "#1C1C1C", border: "#2A2A2A",
      text: "#F0EDE4", dim: "#888", faint: "#555",
      red: "#CC0000", yellow: "#FFCB05", blue: "#4A5FD6", green: "#3DBB50"
    };

    const PT = {
      loose: { n: "Loose pack", cat: "Packs" },
      b1: { n: "1-pack", cat: "Packs" },
      b3: { n: "3-pack", cat: "Packs" },
      mini_tin: { n: "Mini tin (2p)", cat: "Tins" },
      bundle: { n: "Bundle (6p)", cat: "Bundles" },
      etb: { n: "ETB (9p)", cat: "Bundles" },
      pcetb: { n: "PC ETB (11p)", cat: "Bundles" },
      box: { n: "Booster box (36p)", cat: "Boxes" },
      jp_pack: { n: "JP pack", cat: "Japanese" },
      jp_box: { n: "JP box (30p)", cat: "Japanese" },
      kr_pack: { n: "KR pack", cat: "Korean" },
      kr_box: { n: "KR box (30p)", cat: "Korean" }
    };

    const DB = [
      { id: "en_chaos", lang: "en", n: "Chaos Rising", code: "ME04", lean: "rip", note: "Greninja ex SIR $350. Best rip EV.", prods: [{ t: "loose", market: 6.50, v: "skip" }, { t: "b3", market: 14, v: "ok" }, { t: "bundle", market: 30, v: "ok" }, { t: "etb", market: 58, v: "ok" }, { t: "box", market: 235, v: "ok" }] },
      { id: "en_phantasmal", lang: "en", n: "Phantasmal Flames", code: "ME02", lean: "rip", note: "Charizard X SIR $780. Guaranteed ex every pack.", prods: [{ t: "loose", market: 5.50, v: "ok" }, { t: "b3", market: 14, v: "ok" }, { t: "bundle", market: 28, v: "buy" }, { t: "etb", market: 52, v: "buy" }, { t: "box", market: 148, v: "rip" }] },
      { id: "en_151", lang: "en", n: "Pokémon 151", code: "SV3.5", lean: "hold", note: "ETBs 4× MSRP. 30th anniversary demand.", prods: [{ t: "bundle", market: 120, v: "hold" }, { t: "etb", market: 220, v: "hold" }] },
      { id: "en_evolving", lang: "en", n: "Evolving Skies", code: "SWSH7", lean: "hold", note: "Blue-chip. Moonbreon $900.", prods: [{ t: "etb", market: 310, v: "hold" }, { t: "box", market: 2600, v: "hold" }] },
      { id: "jp_sv11w", lang: "jp", n: "White Flare (JP)", code: "SV11W", lean: "rip", note: "Box ~$80. Good JP entry.", prods: [{ t: "jp_pack", market: 4, v: "ok" }, { t: "jp_box", market: 80, v: "ok" }] },
      { id: "kr_sv11b", lang: "kr", n: "Black Bolt (KR)", code: "SV11B", lean: "rip", note: "Box ~$45. Reasonable KR rip.", prods: [{ t: "kr_pack", market: 2, v: "ok" }, { t: "kr_box", market: 45, v: "ok" }] }
    ];

    const PVD = { rip: { l: "RIP IT", c: C.green }, buy: { l: "BUY", c: C.green }, ok: { l: "OK", c: C.yellow }, skip: { l: "SKIP", c: "#F08030" }, hold: { l: "HOLD", c: C.blue } };

    let state = {
      lang: "en",
      sid: "en_chaos",
      tracker: JSON.parse(localStorage.getItem("tcg_tracker") || "[]")
    };

    function renderTabs() {
      const container = document.getElementById("tabButtons");
      const tabs = [
        { id: "scout", icon: "🎯", l: "Scout" },
        { id: "market", icon: "📊", l: "Market" },
        { id: "tracker", icon: "📦", l: "Tracker" }
      ];
      container.innerHTML = tabs.map(t => `<button class="tab-btn active" onclick="switchTab('${t.id}')">${t.icon} ${t.l}</button>`).join("");
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.getElementById("tab-" + tabId).classList.add("active");
      if (tabId === "scout") renderScout();
      if (tabId === "market") renderMarket();
      if (tabId === "tracker") renderTracker();
    }

    function renderScout() {
      const langContainer = document.getElementById("langButtons");
      langContainer.innerHTML = [
        { id: "en", n: "EN" },
        { id: "jp", n: "JP" },
        { id: "kr", n: "KR" }
      ].map(l => `<button class="lang-btn ${state.lang === l.id ? "active" : ""}" onclick="setLang('${l.id}')">${l.n}</button>`).join("");

      const filtered = DB.filter(s => s.lang === state.lang);
      const setSelect = document.getElementById("setSelect");
      setSelect.innerHTML = filtered.map(s => `<option value="${s.id}">${s.n} (${s.code})</option>`).join("");
      setSelect.value = state.sid;
      setSelect.onchange = (e) => { state.sid = e.target.value; renderScout(); };

      const set = DB.find(s => s.id === state.sid) || DB[0];
      document.getElementById("verdictTitle").textContent = set.n;
      document.getElementById("verdictNote").textContent = set.note;

      const grouped = {};
      set.prods.forEach(p => {
        const pt = PT[p.t];
        const cat = pt.cat || "Other";
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(p);
      });

      let html = "";
      for (const [cat, prods] of Object.entries(grouped)) {
        html += `<div class="category-label">${cat.toUpperCase()}</div>`;
        html += `<div class="products-table"><table><thead><tr><th>Product</th><th class="price">Market</th><th class="verdict">Verdict</th></tr></thead><tbody>`;
        prods.forEach((p, i) => {
          const pt = PT[p.t];
          const pv = PVD[p.v] || { l: "—", c: C.faint };
          html += `<tr><td>${pt.n}</td><td class="price">$${p.market}</td><td class="verdict"><span class="badge">${pv.l}</span></td></tr>`;
        });
        html += `</tbody></table></div>`;
      }
      document.getElementById("productsContainer").innerHTML = html;
    }

    function setLang(lang) {
      state.lang = lang;
      state.sid = DB.find(s => s.lang === lang)?.id || "en_chaos";
      renderScout();
    }

    function renderMarket() {
      const set = DB.find(s => s.id === state.sid) || DB[0];
      let html = `<div style="background: #111111; border: 1px solid #2A2A2A; border-radius: 10px; padding: 12px;">`;
      html += `<div style="font-size: 12px; color: #555; margin-bottom: 12px;">Top Products in ${set.n}</div>`;
      set.prods.slice(0, 5).forEach((p, i) => {
        const pt = PT[p.t];
        html += `<div style="display: flex; justify-content: space-between; padding: 8px 0; border-top: ${i > 0 ? "1px solid #2A2A2A" : "none"}"><span>${pt.n}</span><strong style="color: #FFCB05;">$${p.market}</strong></div>`;
      });
      html += `</div>`;
      document.getElementById("marketContent").innerHTML = html;
    }

    function renderTracker() {
      const totals = state.tracker.reduce((a, t) => ({ spent: a.spent + t.cost, now: a.now + t.current }), { spent: 0, now: 0 });
      document.getElementById("trackerSpent").textContent = "$" + totals.spent.toFixed(2);
      document.getElementById("trackerValue").textContent = "$" + totals.now.toFixed(2);
      document.getElementById("trackerValue").style.color = totals.now >= totals.spent ? C.green : C.red;

      let html = "";
      if (state.tracker.length === 0) {
        html = `<div class="empty-state">No purchases yet. Add one below!</div>`;
      } else {
        state.tracker.forEach((t, i) => {
          const pl = t.current - t.cost;
          html += `<div class="tracker-item"><div class="tracker-item-info"><div class="tracker-item-name">${t.name}</div><div class="tracker-item-paid">Paid $${t.cost.toFixed(2)}</div></div><div class="tracker-item-pl"><div class="tracker-item-pl-val" style="color: ${pl >= 0 ? C.green : C.red};">${pl >= 0 ? "+" : ""}$${pl.toFixed(2)}</div><div class="tracker-item-worth">Worth $${t.current.toFixed(2)}</div></div><button class="delete-btn" onclick="deleteTracker(${i})">✕</button></div>`;
        });
      }
      document.getElementById("trackerList").innerHTML = html;
    }

    function addTracker() {
      const name = document.getElementById("trackerName").value;
      const cost = parseFloat(document.getElementById("trackerCost").value) || 0;
      const current = parseFloat(document.getElementById("trackerValue2").value) || 0;
      if (name && cost && current) {
        state.tracker.push({ name, cost, current });
        localStorage.setItem("tcg_tracker", JSON.stringify(state.tracker));
        document.getElementById("trackerName").value = "";
        document.getElementById("trackerCost").value = "";
        document.getElementById("trackerValue2").value = "";
        renderTracker();
      }
    }

    function deleteTracker(idx) {
      state.tracker.splice(idx, 1);
      localStorage.setItem("tcg_tracker", JSON.stringify(state.tracker));
      renderTracker();
    }

    renderTabs();
    renderScout();
    renderTracker();
  </script>
</body>
</html>
