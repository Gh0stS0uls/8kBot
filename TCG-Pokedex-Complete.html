    // ─── SIMPLE OHLC CHART ────────────────────────────────────────────
    function OHLCChart({data,h=200}){
      const canvasRef=useRef(null);
      useEffect(()=>{
        if(!canvasRef.current||!data||data.length<2)return;
        const canvas=canvasRef.current;
        const ctx=canvas.getContext('2d');
        const w=canvas.width=canvas.offsetWidth;
        const h_=canvas.height=h;
        ctx.fillStyle=C.bg;
        ctx.fillRect(0,0,w,h_);
        
        const prices=data.flatMap(d=>[d.o,d.h,d.l,d.c]);
        const min=Math.min(...prices);
        const max=Math.max(...prices);
        const range=max-min||1;
        const pad=40;
        const chartW=w-pad*2;
        const chartH=h_-pad*2;
        const bw=Math.floor(chartW/(data.length*1.5));
        
        data.forEach((candle,i)=>{
          const x=pad+i*(chartW/data.length)+chartW/(data.length*2);
          const yScale=(val)=>h_-pad-((val-min)/range)*chartH;
          const o_y=yScale(candle.o);
          const h_y=yScale(candle.h);
          const l_y=yScale(candle.l);
          const c_y=yScale(candle.c);
          const color=candle.c>=candle.o?C.green:C.red;
          
          ctx.strokeStyle=color;
          ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(x,h_y);
          ctx.lineTo(x,l_y);
          ctx.stroke();
          
          ctx.fillStyle=color;
          const bodyTop=Math.min(o_y,c_y);
          const bodyH=Math.abs(c_y-o_y)||1;
          ctx.fillRect(x-bw/2,bodyTop,bw,bodyH);
        });
        
        ctx.strokeStyle=C.border;
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(pad,h_-pad);
        ctx.lineTo(w-pad,h_-pad);
        ctx.stroke();
      },[data,h]);
      
      return <canvas ref={canvasRef} style={{width:"100%",height:`${h}px`,borderRadius:8,background:C.panel,border:`1px solid ${C.border}`}}/>;
    }

                                <td style={{padding:"8px",textAlign:"center"}}>
                                  <span style={{background:`${pv.c}20`,color:pv.c,border:`1px solid ${pv.c}44`,borderRadius:4,padding:"3px 8px",fontSize:10,fontWeight:700}}>{pv.l}</span>
                                  <div style={{fontSize:9,color:C.faint,marginTop:2}}>{fmtPct(markup)}</div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {tab==="market"&&(
              <div>
                <h3 style={{color:C.yellow,marginBottom:16}}>Market Analysis</h3>
                <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
                  <div style={{fontSize:14,fontWeight:600,marginBottom:8}}>Price Trend: {set.n}</div>
                  <div style={{fontSize:12,color:C.faint,marginBottom:12}}>Current: {fmt$(set.prods[0]?.market||0)}</div>
                  <OHLCChart data={[{o:40,h:65,l:35,c:58},{o:58,h:72,l:55,c:68},{o:68,h:75,l:60,c:70}]} h={150}/>
                </div>
                
                {set.cards&&set.cards.length>0&&(
                  <div>
                    <h3 style={{color:C.yellow,marginBottom:12}}>Top Cards</h3>
                    {set.cards.slice(0,3).map((card,i)=>(
                      <div key={i} style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:10,padding:12,marginBottom:8}}>
                        <div style={{fontWeight:600}}>{card.n}</div>
                        <div style={{fontSize:12,color:C.faint,marginTop:4}}>Pull rate: 1 in {Math.round(1/card.pull)} packs</div>
                        <div style={{fontSize:12,color:C.yellow,marginTop:2}}>Raw: ${card.raw} → PSA 10: ${card.p10}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {tab==="analyzer"&&(
              <div>
                <h3 style={{color:C.yellow,marginBottom:16}}>Pull Rate Calculator</h3>
                {set.cards&&set.cards.length>0?(
                  <div>
                    {set.cards.map((card,i)=>{
                      const rate=Math.round(1/card.pull);
                      return (
                        <div key={i} style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:10,padding:12,marginBottom:8}}>
                          <div style={{fontWeight:600,marginBottom:6}}>{card.n}</div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                            <div style={{fontSize:12}}>
                              <div style={{color:C.faint}}>Pull Rate</div>
                              <div style={{color:C.green,fontWeight:700}}>1 in {rate}</div>
                            </div>
                            <div style={{fontSize:12}}>
                              <div style={{color:C.faint}}>For 1 hit</div>
                              <div style={{color:C.yellow,fontWeight:700}}>{Math.ceil(rate/9)} boxes</div>
                            </div>
                          </div>
                          <div style={{fontSize:11,color:C.faint,marginTop:8}}>Raw ${card.raw} | PSA 10: ${card.p10}</div>
                        </div>
                      );
                    })}
                  </div>
                ):(
                  <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:10,padding:20,textAlign:"center",color:C.faint}}>
                    No pull rate data for this set yet.
                  </div>
                )}
              </div>
            )}

            {tab==="grade"&&(
              <div>
                <h3 style={{color:C.yellow,marginBottom:16}}>Grading ROI Calculator</h3>
                <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
                  <div style={{fontSize:13,color:C.faint,marginBottom:12}}>Grading economics (based on industry averages)</div>
                  {GRADERS.map((g,i)=>(
                    <div key={i} style={{marginBottom:12,paddingBottom:12,borderBottom:i<GRADERS.length-1?`1px solid ${C.border}`:"none"}}>
                      <div style={{fontWeight:600,marginBottom:6}}>{g.n} ({g.days})</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:12}}>
                        <div>
                          <div style={{color:C.faint}}>Cost</div>
                          <div style={{color:C.yellow,fontWeight:600}}>${g.cost}</div>
                        </div>
                        <div>
                          <div style={{color:C.faint}}>M10 multiplier</div>
                          <div style={{color:C.green,fontWeight:600}}>{g.m10}×</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab==="compare"&&(
              <div>
                <h3 style={{color:C.yellow,marginBottom:16}}>Compare Sets</h3>
                <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
                  <div style={{fontSize:13,color:C.faint,marginBottom:12}}>Select up to 3 sets to compare metrics</div>
                  <select multiple style={{marginBottom:12,height:150}} onChange={()=>{}}>
                    {filtered.slice(0,5).map(s=>(
                      <option key={s.id} value={s.id}>{s.n}</option>
                    ))}
                  </select>
                  <div style={{fontSize:12,color:C.faint,textAlign:"center"}}>(Feature coming soon)</div>
                </div>
              </div>
            )}

            {tab==="budget"&&(
              <div>
                <h3 style={{color:C.yellow,marginBottom:16}}>Portfolio Allocation</h3>
                <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:16,marginBottom:16}}>
                  <div style={{fontSize:13,color:C.faint,marginBottom:12}}>Allocate your investment budget across set categories</div>
                  {["Modern Hold","Vintage Asset","Grading Flip","International"].map((cat,i)=>(
                    <div key={i} style={{marginBottom:12}}>
                      <label style={{fontSize:12,color:C.faint,display:"block",marginBottom:4}}>{cat}</label>
                      <input type="number" placeholder="$" defaultValue="0" style={{marginBottom:8}} min="0"/>
                      <div style={{fontSize:11,color:C.dim}}>&nbsp;</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab==="tracker"&&(
              <div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
                  <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px"}}>
                    <div style={{fontSize:10,color:C.faint}}>Spent</div>
                    <div style={{fontSize:16,fontWeight:700,color:C.text,marginTop:4}}>${trackerTotals.spent.toFixed(2)}</div>
                  </div>
                  <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px"}}>
                    <div style={{fontSize:10,color:C.faint}}>Value Now</div>
                    <div style={{fontSize:16,fontWeight:700,color:trackerTotals.now>=trackerTotals.spent?C.green:C.red,marginTop:4}}>${trackerTotals.now.toFixed(2)}</div>
                  </div>
                </div>

                {tracker.length===0?(
                  <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:10,padding:"20px",textAlign:"center",color:C.faint}}>
                    No purchases yet. Add one below!
                  </div>
                ):(
                  <div style={{marginBottom:16}}>
                    {tracker.map((t,i)=>{
                      const pl=t.current-t.cost;
                      return (
                        <div key={i} style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px",marginBottom:8,display:"flex",alignItems:"center",gap:12}}>
                          <div style={{flex:1}}>
                            <div style={{fontWeight:600}}>{t.name}</div>
                            <div style={{fontSize:11,color:C.faint}}>Paid ${t.cost.toFixed(2)}</div>
                          </div>
                          <div style={{textAlign:"right"}}>
                            <div style={{fontSize:14,fontWeight:700,color:pl>=0?C.green:C.red}}>{pl>=0?"+":""}${pl.toFixed(2)}</div>
                            <div style={{fontSize:10,color:C.faint}}>Worth ${t.current.toFixed(2)}</div>
                          </div>
                          <button onClick={()=>setTracker(tr=>tr.filter((_,j)=>j!==i))} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.faint,borderRadius:6,padding:"6px 10px",cursor:"pointer"}}>✕</button>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:10,padding:12}}>
                  <input placeholder="What (e.g. Evolving Skies ETB)" value={newT.name} onChange={e=>setNewT(n=>({...n,name:e.target.value}))} style={{marginBottom:8}}/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                    <input type="number" placeholder="Paid $" value={newT.cost} onChange={e=>setNewT(n=>({...n,cost:e.target.value}))} step="0.01" min="0"/>
                    <input type="number" placeholder="Worth now $" value={newT.current} onChange={e=>setNewT(n=>({...n,current:e.target.value}))} step="0.01" min="0"/>
                  </div>
                  <button onClick={()=>{if(newT.name&&newT.cost&&newT.current){setTracker(tr=>[...tr,{name:newT.name,cost:+newT.cost,current:+newT.current}]);setNewT({name:"",cost:"",current:""});}}} style={{width:"100%"}}>+ Add Purchase</button>
                </div>
              </div>
            )}

            {tab==="show"&&(
              <div>
                <h3 style={{color:C.yellow,marginBottom:16}}>At a Show</h3>
                <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
                  <div style={{fontSize:13,color:C.faint,marginBottom:12}}>Quick reference for valuing sealed product at events</div>
                  <div style={{background:C.p2,borderRadius:8,padding:12,marginBottom:12}}>
                    <div style={{fontSize:11,color:C.faint,marginBottom:6}}>Selected Set: <strong>{set.n}</strong></div>
                    <div style={{fontSize:12}}>
                      {set.prods.slice(0,3).map((p,i)=>{
                        const pt=PT[p.t];
                        return (
                          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:i<2?`1px solid ${C.border}`:"none"}}>
                            <span>{pt.n}</span>
                            <strong style={{color:C.yellow}}>${p.market}</strong>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  <button style={{width:"100%",padding:"10px"}}>Refresh from Market</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
